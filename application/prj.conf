CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# POSIX API com suporte a threads
CONFIG_POSIX_API=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=6
CONFIG_POSIX_THREAD_THREADS_MAX=6

# Console via UART (redirecionado para USB CDC no overlay)
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Logs
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_BUFFER_SIZE=32768

# ADC — CONFIG_ADC=y keeps the #ifdef CONFIG_ADC guards in main.cpp/adc.c.
# ADC_RPI_PICO (default y) provides hardware/adc.h via PICOSDK_USE_ADC.
# NOTE: PICOSDK_USE_ADC has no Kconfig prompt — do NOT set it directly here.
CONFIG_ADC=y

# DMA — Zephyr API used by adc.c; &dma in the overlay selects DMA_RPI_PICO.
CONFIG_DMA=y

# DSP — floating point for sqrtf
CONFIG_FPU=y
CONFIG_FP_HARDABI=y