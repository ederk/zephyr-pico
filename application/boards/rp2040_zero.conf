# Específico para RP2040 Zero - tem LED WS2812\
CONFIG_PWM=y
CONFIG_LED_STRIP=y

#USB
CONFIG_USB_DEVICE_STACK=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr CDC ACM"
CONFIG_USB_DEVICE_MANUFACTURER="Zephyr Project"
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x000A
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
#CDC ACM
CONFIG_USB_CDC_ACM=y
